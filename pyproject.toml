[tool.poetry]
name = "pcot"
version = "1.1.0"    # must match the number in src/pcot/VERSION.txt (checked by tests/config/test_version_check.py)
description = "PanCam Operations Toolkit"
authors = ["Jim Finnis <jcf12@aber.ac.uk>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/AU-ExoMars/PCOT"
documentation = "https://au-exomars.github.io/PCOT/"
keywords = ["calibration", "processing", "image", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/AU-ExoMars/PCOT/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
PySide6 = ">=6.9.3,<7"
opencv-python-headless = ">=4.10.0.84,<5"
scikit-image = ">=0.21,<0.27"
numpy = "^1.21.5"     # <2 until proctools is re-released without its numpy<2 pin
matplotlib = "^3.5.0"
pds4-tools = "^1.2"
markdown = "^3.3.6"
click = "^8.1"
# these four are imported directly by PCOT; they used to arrive only as dependencies
# of other packages (mkdocs, scikit-image, matplotlib), which pip users can't rely on
PyYAML = "^6.0"
Jinja2 = "^3.1"
scipy = "^1.10"
python-dateutil = "^2.8"
# proctools = { path = "./dist/proctools", develop = true }
proctools = "^0.2.1"


# Future:
#passthrough = "0.3.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=3.5"
black = "^20.8b1"
isort = "^5.8.0"

# only needed to build the documentation site, not to run PCOT
[tool.poetry.group.docs.dependencies]
mkdocs = "^1.2.3"
pymdown-extensions = ">=9.1"

[tool.pytest.ini_options]
python_functions = "test_"
minversion = "6.0"
testpaths = [
    "tests",
]

# these warnings are for datumfuncs which Pytest thinks are tests.
filterwarnings = [
    "ignore:cannot collect 'testimg' because it is not a function",
    "ignore:cannot collect 'testfunc1' because it is not a function",
    "ignore:cannot collect 'testfunc2' because it is not a function"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pcot = 'pcot.main:main'
pcotbatch = 'pcot.batch:main'

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
(
  /(
    | \.git
    | build
    | dist
  )/
)
'''
experimental-string-processing = true


[tool.isort] # black compatibility
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

